name: Build installable APK

on:
  push:
    branches: [ main, 'design/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'tablodecori-android-source*.zip' | head -n 1 || true)"
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p project
            unzip -q "$ZIP_FILE" -d project
            PROJECT_DIR="$(dirname "$(find project -type f -name 'settings.gradle.kts' -print -quit)")"
            if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
              echo "Android project root was not found inside $ZIP_FILE"
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            echo "Using source archive: $ZIP_FILE"
            echo "Android project root: $PROJECT_DIR"
            # The uploaded archive contains a bootstrap wrapper JAR that is not
            # needed here because setup-gradle installs Gradle 8.13 directly.
            # Remove it so GitHub's wrapper-integrity check does not reject it.
            rm -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
            # Keep the project on the widely available Android API 36 toolchain.
            # Pin AndroidX/Compose to the September 2025 API-36-compatible set.
            sed -i '/kotlinOptions { jvmTarget = "17" }/d' "$PROJECT_DIR/app/build.gradle.kts"
            sed -i 's/compose-bom:2026.09.00/compose-bom:2025.09.00/g' "$PROJECT_DIR/app/build.gradle.kts"
            sed -i 's/core-ktx:1.19.1/core-ktx:1.17.0/g' "$PROJECT_DIR/app/build.gradle.kts"
            sed -i 's/activity-compose:1.13.0/activity-compose:1.11.0/g' "$PROJECT_DIR/app/build.gradle.kts"
            sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.9.4/g' "$PROJECT_DIR/app/build.gradle.kts"
            sed -i 's/lifecycle-viewmodel-compose:2.11.0/lifecycle-viewmodel-compose:2.9.4/g' "$PROJECT_DIR/app/build.gradle.kts"
            sed -i 's/navigation-compose:2.10.2/navigation-compose:2.9.4/g' "$PROJECT_DIR/app/build.gradle.kts"
            sed -i 's/room-runtime:2.8.5/room-runtime:2.8.1/g' "$PROJECT_DIR/app/build.gradle.kts"
            sed -i 's/room-ktx:2.8.5/room-ktx:2.8.1/g' "$PROJECT_DIR/app/build.gradle.kts"
            sed -i 's/room-compiler:2.8.5/room-compiler:2.8.1/g' "$PROJECT_DIR/app/build.gradle.kts"
            sed -i '/implementation("androidx.compose.material3:material3")/a\    implementation("androidx.compose.material:material-icons-extended")' "$PROJECT_DIR/app/build.gradle.kts"
            # Apply V2 interface overrides maintained in the repository.
            cp ci/v2/MainActivity.kt "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/MainActivity.kt"
            cp ci/v2/Components.kt "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/ui/Components.kt"
            cp ci/v2/Theme.kt "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/ui/theme/Theme.kt"
            python3 -c 'import sys; from pathlib import Path; p=Path(sys.argv[1]); s=p.read_text(); a=s.index("@Composable fun HomeScreen"); b=s.index("@Composable fun VariablesScreen"); s=s[:a]+s[b:]; s=s.replace("متغیرها و متریال‌ها","متریال‌ها و هزینه‌ها").replace("قیمت، پرت، فرمول و روشن/خاموش","قیمت، پرت، روش محاسبه و وضعیت فعال").replace("ست‌ها و محصولات","محصولات و ست‌ها").replace("هر تعداد تابلو با هر ابعاد","ترکیب تابلوها با قیمت‌گذاری زنده").replace("محاسبه سریع ست","محاسبه سریع").replace("بدون نیاز به ذخیره محصول","قیمت‌گیری فوری، بدون نیاز به ذخیره محصول"); p.write_text(s)' "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/ui/screens/CoreScreens.kt"
            cp ci/v2/CoreScreens.kt "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/ui/screens/CoreScreens.kt"
            cp ci/v2/BusinessScreens.kt "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/ui/screens/BusinessScreens.kt"
            cp ci/v2/HomeScreen.kt "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/ui/screens/HomeScreen.kt"
            mkdir -p "$PROJECT_DIR/app/src/main/res/drawable-nodpi"
            rm -f "$PROJECT_DIR/app/src/main/res/drawable/tablodecori_logo.xml" "$PROJECT_DIR/app/src/main/res/drawable/tablodecori_logo.png" "$PROJECT_DIR/app/src/main/res/drawable/tablodecori_logo.webp"
            rm -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/tablodecori_logo.xml" "$PROJECT_DIR/app/src/main/res/drawable-nodpi/tablodecori_logo.png" "$PROJECT_DIR/app/src/main/res/drawable-nodpi/tablodecori_logo.webp"
            base64 -d ci/v2/tablodecori_logo.b64 > "$PROJECT_DIR/app/src/main/res/drawable-nodpi/tablodecori_logo.webp"
            cp ci/v2/Daos.kt "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/data/db/Daos.kt"
            cp ci/v2/AppDatabase.kt "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/data/db/AppDatabase.kt"
            python3 -c 'import sys; from pathlib import Path; p=Path(sys.argv[1]); s=p.read_text(); s=s.replace("db.materialDao().get(id)?.let { db.materialDao().upsert(it.copy(enabled = enabled, updatedAt = System.currentTimeMillis())) }", "db.materialDao().setEnabled(id, enabled, System.currentTimeMillis())"); p.write_text(s)' "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/data/WorkshopRepository.kt"
            sed -i '/android:roundIcon=/d' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
            sed -i '/android:icon="@drawable\/tablodecori_logo"/a\        android:roundIcon="@drawable/tablodecori_logo"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
            sed -i 's/قیمت‌نامه/لیست قیمت/g' "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/ui/screens/BusinessScreens.kt"
            sed -i 's/سفارش‌های ارسالی/سفارش‌ها/g' "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/ui/screens/BusinessScreens.kt"
            # Fix Kotlin compilation in the daily chart: Map.entries is a Set,
            # so convert it to a List before calling takeLast().
            sed -i 's/by.entries.takeLast(12)/by.entries.toList().takeLast(12)/g' "$PROJECT_DIR/app/src/main/java/com/tablodecori/app/ui/screens/BusinessScreens.kt"
          elif [ -f app/build.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "No tablodecori Android source archive or app/build.gradle.kts found."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build-output.log

      - name: Save failed build log
        if: failure()
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/build-output.log" ]; then
            cp "$PROJECT_DIR/build-output.log" ci/last-build.log
            git config user.name "github-actions"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci/last-build.log
            git commit -m "Save latest failed build log [skip ci]" || exit 0
            git push
          fi

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" out/tablodecori-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tablodecori-installable-apk
          path: out/tablodecori-debug.apk
          if-no-files-found: error
