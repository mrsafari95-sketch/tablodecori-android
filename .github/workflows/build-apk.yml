name: Build installable APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'tablodecori-android-source*.zip' | head -n 1 || true)"
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p project
            unzip -q "$ZIP_FILE" -d project
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            echo "Using source archive: $ZIP_FILE"
          elif [ -f app/build.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "No tablodecori Android source archive or app/build.gradle.kts found."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon test assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" out/tablodecori-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tablodecori-installable-apk
          path: out/tablodecori-debug.apk
          if-no-files-found: error
