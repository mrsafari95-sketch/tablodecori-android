name: Build installable APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'tablodecori-android-source*.zip' | head -n 1 || true)"
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p project
            unzip -q "$ZIP_FILE" -d project
            PROJECT_DIR="$(dirname "$(find project -type f -name 'settings.gradle.kts' -print -quit)")"
            if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
              echo "Android project root was not found inside $ZIP_FILE"
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            echo "Using source archive: $ZIP_FILE"
            echo "Android project root: $PROJECT_DIR"
            # The uploaded archive contains a bootstrap wrapper JAR that is not
            # needed here because setup-gradle installs Gradle 8.13 directly.
            # Remove it so GitHub's wrapper-integrity check does not reject it.
            rm -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
            # Kotlin 2.3 rejects the legacy android.kotlinOptions jvmTarget DSL.
            # The Java target is already 17; remove the obsolete line and let
            # Kotlin use the modern toolchain/compiler defaults for this build.
            sed -i '/kotlinOptions { jvmTarget = "17" }/d' "$PROJECT_DIR/app/build.gradle.kts"
            # Current Compose/AndroidX releases require Android 17 / API 37 for compilation.
            sed -i 's/compileSdk = 36/compileSdk = 37/' "$PROJECT_DIR/app/build.gradle.kts"
            # Current AndroidX dependencies require AGP 9.1+.
            sed -i 's/id("com.android.application") version "8.13.2"/id("com.android.application") version "9.1.1"/' "$PROJECT_DIR/build.gradle.kts"
            # Keep the existing external Kotlin Android plugin during this build.
            {
              echo 'android.builtInKotlin=false'
              echo 'android.newDsl=false'
            } >> "$PROJECT_DIR/gradle.properties"
          elif [ -f app/build.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "No tablodecori Android source archive or app/build.gradle.kts found."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon test assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" out/tablodecori-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tablodecori-installable-apk
          path: out/tablodecori-debug.apk
          if-no-files-found: error
